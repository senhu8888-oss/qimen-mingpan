<meta name="claude:viewport-fit-sides" content="cover">
<title>奇门命盘</title>
<style>
/* 布局概念：一台正在运转的星盘仪器。命盘居中占主视觉，右侧是读盘说明，下方是全天热力图与月历。
   单一深色世界（古代术数 × 数据可视化），颜色全部来自下面的令牌。 */
:root {
  --bg: #070b17;
  --bg-2: #0c1326;
  --panel: rgba(12, 19, 38, 0.82);
  --panel-solid: #0d1428;
  --line: rgba(226, 187, 104, 0.22);
  --line-strong: rgba(226, 187, 104, 0.55);
  --gold: #e2bb68;
  --gold-dim: #a98a4a;
  --paper: #f1e7d0;
  --muted: #a3aec4;
  --ice: #8cc4e6;
  --cinnabar: #d9482f;
  --bad-text: #f3897a;
  --good-text: #e8c978;
  --ink: #16110a;
  --f-display: "STKaiti", "KaiTi", "Kaiti SC", "楷体", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "PingFang SC", "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Noto Sans SC", "Hiragino Sans GB", "Source Han Sans SC", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--paper);
  font: 15px/1.65 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }
h2 { font: 400 22px/1.3 var(--f-display); letter-spacing: 0.08em; text-wrap: balance; }
h3 { font: 600 15px/1.4 var(--f-body); color: var(--gold); letter-spacing: 0.04em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; }

/* 顶栏 */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 28px; padding: 26px 0 16px; }
.top h1 { font: 400 38px/1.1 var(--f-display); letter-spacing: 0.18em; color: var(--paper); text-shadow: 0 0 24px rgba(226, 187, 104, 0.35); }
.top .sub { color: var(--muted); font-size: 13px; margin-top: 6px; letter-spacing: 0.06em; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 16px; margin-bottom: -1px; color: var(--muted); font-size: 15px; letter-spacing: 0.1em; }
.tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
.tabs button:hover { color: var(--paper); }

.view { display: block; }

/* 日期栏 */
.daybar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 6px 0 14px; }
.datenav { display: flex; align-items: center; gap: 6px; }
.btn { background: rgba(226, 187, 104, 0.08); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; color: var(--paper); line-height: 1.3; transition: background 0.15s, border-color 0.15s; }
.btn:hover { background: rgba(226, 187, 104, 0.18); border-color: var(--line-strong); }
.btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 600; }
.btn.primary:hover { background: #efca7e; }
.btn.sq { padding: 6px 10px; min-width: 36px; }
input[type="date"], input[type="time"], input[type="datetime-local"], input[type="number"], select {
  background: rgba(7, 11, 23, 0.8); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--paper); min-height: 34px; max-width: 100%;
}
input:focus-visible, select:focus-visible { border-color: var(--ice); }
.pill { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(12, 19, 38, 0.6); font-size: 13px; color: var(--muted); }
.pill b { font: 400 18px/1.2 var(--f-display); color: var(--paper); letter-spacing: 0.06em; }
.pillars { display: flex; flex-wrap: wrap; gap: 8px; }
.livetag { color: var(--gold); font-size: 12px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 6px; }

/* 全天概览 */
.daysum { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; padding: 14px 18px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.daysum .big { display: flex; align-items: baseline; gap: 10px; }
.vw { font: 400 44px/1 var(--f-display); letter-spacing: 0.1em; }
.vs { font-size: 15px; color: var(--muted); }
.v-good .vw { color: var(--good-text); }
.v-bad .vw { color: var(--bad-text); }
.v-mid .vw { color: var(--paper); }
.daysum .txt { display: grid; gap: 4px; font-size: 14px; min-width: 0; }
.daysum .txt b { color: var(--gold); font-weight: 600; margin-right: 6px; }
.tag { display: inline-block; padding: 1px 8px; margin: 2px 4px 2px 0; border-radius: 4px; font-size: 13px; border: 1px solid var(--line); }
.tag.g { color: var(--good-text); border-color: rgba(226, 187, 104, 0.5); }
.tag.b { color: var(--bad-text); border-color: rgba(243, 137, 122, 0.45); }

/* 主区 */
.main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 22px; align-items: start; }
.stage { position: relative; min-width: 0; }
.stage::before { content: ""; position: absolute; inset: 4% -4% 0; background: radial-gradient(circle at 50% 46%, rgba(80, 120, 190, 0.22), rgba(226, 187, 104, 0.06) 40%, transparent 68%); pointer-events: none; z-index: -1; }
.slots { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: thin; }
.slot { flex: 1 0 44px; display: grid; gap: 0; justify-items: center; padding: 5px 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: rgba(12, 19, 38, 0.6); line-height: 1.2; }
.slot b { font: 400 19px/1.2 var(--f-display); }
.slot small { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.slot .sc { font-size: 11px; font-variant-numeric: tabular-nums; }
.slot[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.slot.now b::after { content: "·"; color: var(--ice); margin-left: 1px; }
.layerbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 4px 0 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 11px; font-size: 13px; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: rgba(226, 187, 104, 0.18); color: var(--gold); }
.layercap { font-size: 13px; color: var(--muted); min-height: 1.6em; }
.plate-wrap { width: 100%; max-width: 780px; margin: 0 auto; aspect-ratio: 1; }
.plate-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* 命盘 SVG */
svg text { font-family: var(--f-body); }
svg .kai { font-family: var(--f-display); }
.cellbg { stroke: var(--line); stroke-width: 1; }
.cell { cursor: pointer; }
.cell:hover .cellbg { stroke: var(--line-strong); }
.cell.sel .cellbg { stroke: var(--gold); stroke-width: 2.4; }
.cell:focus-visible { outline: none; }
.cell:focus-visible .cellbg { stroke: var(--ice); stroke-width: 3; }
.c-g2 { fill: var(--good-text); }
.c-g1 { fill: var(--paper); }
.c-m { fill: var(--muted); }
.c-b1 { fill: #ebaa94; }
.c-b2 { fill: var(--bad-text); }
.t-stem { fill: var(--paper); }
.t-earth { fill: var(--ice); }
.t-jia { fill: var(--cinnabar); font-weight: 700; }
.t-dim { fill: var(--muted); }
.ring-seg { fill: rgba(226, 187, 104, 0.05); stroke: var(--line); stroke-width: 1; cursor: pointer; }
.ring-seg:hover { stroke: var(--line-strong); }
.ring-seg.on { stroke: var(--gold); stroke-width: 2.4; }
.ring-seg:focus-visible { outline: none; stroke: var(--ice); stroke-width: 3; }
svg[data-layer="earth"] .l-star, svg[data-layer="earth"] .l-door, svg[data-layer="earth"] .l-deity,
svg[data-layer="heaven"] .l-earth, svg[data-layer="heaven"] .l-door, svg[data-layer="heaven"] .l-deity,
svg[data-layer="door"] .l-earth, svg[data-layer="door"] .l-star, svg[data-layer="door"] .l-deity,
svg[data-layer="deity"] .l-earth, svg[data-layer="deity"] .l-star, svg[data-layer="deity"] .l-door { opacity: 0.12; }
.l-earth, .l-star, .l-door, .l-deity { transition: opacity 0.25s; }

/* 读盘面板 */
.reading { min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 18px 20px 20px; display: grid; gap: 16px; }
.rd-top { display: grid; gap: 8px; }
.rd-top .big { display: flex; align-items: baseline; gap: 12px; }
.meter { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #9a3426, #323c5e 50%, #e2bb68); }
.meter i { position: absolute; top: -4px; width: 3px; height: 14px; background: var(--paper); border-radius: 2px; transform: translateX(-50%); box-shadow: 0 0 6px rgba(241, 231, 208, 0.7); }
.meter-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.advice { color: var(--paper); font-size: 14.5px; }
.narrate { font: 400 16px/1.75 var(--f-display); color: var(--paper); padding: 10px 14px; border-left: 2px solid var(--gold); background: rgba(226, 187, 104, 0.06); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.facts .pill b { font-size: 16px; }
.flags { display: grid; gap: 6px; }
.flag { font-size: 13.5px; padding: 6px 10px; border-radius: 6px; background: rgba(217, 72, 47, 0.12); border: 1px solid rgba(243, 137, 122, 0.35); }
.flag b { color: var(--bad-text); margin-right: 6px; }
.dirs { display: grid; gap: 6px; font-size: 14px; }
.dirs div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; }
.dirs .k { color: var(--muted); min-width: 3em; }
.pal { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.pal-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.pal-head .nm { font: 400 24px/1.2 var(--f-display); color: var(--gold); letter-spacing: 0.08em; }
.trio { display: grid; gap: 8px; }
.trio .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 14px; min-width: 0; }
.trio .row .k { color: var(--muted); min-width: 2.6em; }
.trio .row b { font-weight: 600; }
.trio .row .d { flex-basis: 100%; padding-left: calc(2.6em + 10px); color: var(--muted); font-size: 13.5px; }
.notes { display: grid; gap: 6px; font-size: 13.5px; }
.note { padding-left: 14px; position: relative; }
.note::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.note.good::before { background: var(--gold); }
.note.bad::before { background: var(--cinnabar); }
.why { border-top: 1px solid var(--line); padding-top: 12px; }
.why summary { cursor: pointer; color: var(--gold); font-size: 14px; }
.why ul { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); display: grid; gap: 4px; }
.hint { font-size: 12.5px; color: var(--muted); }

/* 章节 */
.sec { margin-top: 34px; display: grid; gap: 12px; }
.sec > p.hint { max-width: 70ch; }

/* 热力图 */
.heat { display: grid; gap: 3px; min-width: 0; }
.hrow { display: grid; grid-template-columns: 4.4em repeat(12, minmax(0, 1fr)); gap: 3px; align-items: stretch; }
.hl { display: flex; align-items: center; font-size: 13px; color: var(--muted); padding-right: 4px; }
.hrow.sum .hl { color: var(--gold); font-weight: 600; }
.hc { border: 0; border-radius: 4px; padding: 7px 0; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; min-width: 0; }
.hc.head { background: none; padding: 2px 0 4px; font: 400 17px/1.2 var(--f-display); color: var(--paper); }
.hc.head small { display: block; font: 400 10px/1.2 var(--f-body); color: var(--muted); }
.hc.on { outline: 2px solid var(--paper); outline-offset: -2px; }
.hc.head.on { outline: 0; color: var(--gold); border-bottom: 2px solid var(--gold); border-radius: 0; }
.hc.now::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 3px; border-radius: 50%; background: var(--ice); vertical-align: middle; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 12.5px; color: var(--muted); }
.legend .bar { width: 160px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgb(150, 44, 32), rgb(48, 60, 94) 50%, rgb(228, 190, 106)); }

/* 月历 */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; max-width: 560px; }
.cal .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.cal button { border: 1px solid transparent; border-radius: 6px; min-height: 44px; display: grid; align-content: center; justify-items: center; line-height: 1.15; padding: 2px; }
.cal button b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cal button small { font-size: 11px; font-variant-numeric: tabular-nums; opacity: 0.85; }
.cal button.on { border-color: var(--paper); box-shadow: 0 0 0 1px var(--paper) inset; }
.cal button.today b::after { content: "·"; margin-left: 2px; }
.cal .pad { min-height: 0; }

/* 生辰 */
.bgrid { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 22px; align-items: start; }
.formcard { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 18px 20px; display: grid; gap: 14px; }
.field { display: grid; gap: 4px; }
.field > label, .field > .lb { font-size: 13px; color: var(--muted); }
.field .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.field .row label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--paper); }
.field input[type="radio"], .field input[type="checkbox"] { accent-color: var(--gold); width: 16px; height: 16px; }
.example { font-size: 12.5px; color: var(--gold); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 6px 10px; }
.bout { display: grid; gap: 24px; min-width: 0; }
.bpil { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 520px; }
.bp { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); text-align: center; padding: 10px 4px 12px; display: grid; gap: 0; }
.bp .cap { font-size: 12px; color: var(--muted); }
.bp .gz { font: 400 40px/1.15 var(--f-display); }
.bp .sub2 { font-size: 12px; color: var(--muted); min-height: 1.5em; }
.bp.me { border-color: var(--gold); }
.wx { display: grid; gap: 6px; max-width: 520px; }
.wxr { display: grid; grid-template-columns: 2em 1fr 1.6em; align-items: center; gap: 10px; font-size: 14px; }
.wxr .tr { height: 10px; background: rgba(255, 255, 255, 0.07); border-radius: 5px; overflow: hidden; }
.wxr .tr i { display: block; height: 100%; border-radius: 5px; }
.read { display: grid; gap: 12px; max-width: 70ch; }
.read .blk { border-left: 2px solid var(--line-strong); padding: 2px 0 2px 14px; display: grid; gap: 3px; font-size: 14.5px; }
.read .blk b { color: var(--gold); font-weight: 600; }
.pbars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 150px; position: relative; max-width: 640px; padding-top: 4px; }
.pbars::before { content: ""; position: absolute; left: 0; right: 0; bottom: 50%; border-top: 1px dashed var(--line-strong); }
.pb { display: grid; align-items: end; height: 100%; position: relative; border: 0; background: none; padding: 0; min-width: 0; }
.pb i { display: block; border-radius: 3px 3px 0 0; min-height: 3px; }
.pb em { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pblab { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; max-width: 640px; text-align: center; font: 400 15px/1.2 var(--f-display); }
.pb.on i { outline: 2px solid var(--paper); }

/* 规则页 */
.rules { display: grid; gap: 30px; max-width: 920px; }
.rules section { display: grid; gap: 10px; }
.rules p, .rules li { font-size: 14.5px; }
.rules ol, .rules ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.tablebox table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 380px; }
.tablebox th, .tablebox td { padding: 6px 10px; text-align: left; border-bottom: 1px solid rgba(226, 187, 104, 0.12); white-space: nowrap; }
.tablebox td.w { white-space: normal; min-width: 14em; }
.tablebox th { color: var(--gold); font-weight: 600; background: rgba(226, 187, 104, 0.06); }
.tablebox tr:last-child td { border-bottom: 0; }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.ok { color: var(--good-text); }
.warn { color: var(--bad-text); }

footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; max-width: 80ch; }

@media (max-width: 980px) {
  .main, .bgrid { grid-template-columns: minmax(0, 1fr); }
  .daysum { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .top h1 { font-size: 30px; }
  .vw { font-size: 38px; }
  .hl { font-size: 12px; }
  .hc { font-size: 11.5px; padding: 6px 0; }
  .hrow { grid-template-columns: 3.6em repeat(12, minmax(0, 1fr)); gap: 2px; }
  .hc.head { font-size: 15px; }
  .hc.head small { display: none; }
  .bp .gz { font-size: 34px; }
  .tabs button { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

.flag.edge { background: rgba(226, 187, 104, 0.08); border-color: var(--line-strong); }
.flag.edge b { color: var(--gold); }
.note.good { color: var(--paper); }
.note.bad { color: var(--bad-text); }
.tag { white-space: nowrap; }
.tabs button { min-height: 40px; }
.mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(12, 19, 38, 0.5); }
.btn[aria-pressed="true"] { background: rgba(226, 187, 104, 0.2); border-color: var(--gold); color: var(--gold); }
.mbar .lb { color: var(--muted); font-size: 13px; }
.mbar .layerbar { margin: 0; }
.mbar .mp { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.mbar .mp input { width: 72px; }
.mbar .hint { flex: 1 1 220px; min-width: 0; }
.pill.hot { border-color: var(--gold); }
.pill > span { font-size: 12px; }
.hxrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.hxcard { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px; display: grid; gap: 8px; justify-items: center; text-align: center; min-width: 0; }
.hxcard h3 { margin: 0; }
.hx { display: grid; gap: 7px; width: min(120px, 100%); }
.hx-line i { display: block; height: 9px; border-radius: 2px; background: var(--paper); }
.hx-line i.yin { background: linear-gradient(90deg, var(--paper) 0 40%, transparent 40% 60%, var(--paper) 60%); }
.hx-line.mov i { background: var(--cinnabar); }
.hx-line.mov i.yin { background: linear-gradient(90deg, var(--cinnabar) 0 40%, transparent 40% 60%, var(--cinnabar) 60%); }
.hxname { font: 400 22px/1.2 var(--f-display); color: var(--paper); }
.zwgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(118px, auto)); gap: 4px; }
.zwc { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 5px 6px; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.zwc.ming { border-color: var(--gold); }
.zwc .hd { display: flex; justify-content: space-between; gap: 4px; color: var(--muted); font-size: 12px; }
.zwc .hd b { color: var(--paper); font-weight: 500; }
.zwc .st { color: var(--paper); line-height: 1.35; }
.zwc .st i { font-style: normal; font-size: 11px; color: var(--gold); margin-left: 2px; }

  // 以“日柱换日规则”得到的绝对日序号（儒略日数；23:00 起算次日），干支序 = (abs − 2451545 + 54) mod 60
  function absDayOf(utMs, lon) {
    const cd = new Date(clockMs(utMs, lon));
    let jd = jdnCivil(cd.getUTCFullYear(), cd.getUTCMonth() + 1, cd.getUTCDate());
    if (cd.getUTCHours() >= 23) jd += 1;
    return jd;
  }
  const gzOfAbs = (a) => (((a - 2451545 + 54) % 60) + 60) % 60;
  const isShangYuanFutou = (a) => gzOfAbs(a) % 15 === 0;   // 甲子、己卯、甲午、己酉

  function chaoKind(d) { return d === 0 ? '正授' : d > 0 ? '超神' : '接气'; }

  // 置闰法的“块表”：从 epochYear 起，每 5 天一块，记录该块使用的节气、元、是否闰期
  const zhirunCache = new Map();
  function zhirunBlocks(chaoLimit, epochYear) {
    const key = chaoLimit + ':' + epochYear;
    if (zhirunCache.has(key)) return zhirunCache.get(key);
    let list = [];
    for (let y = epochYear; y <= 2102; y++) list = list.concat(termsOfYear(y));
    list.sort((a, b) => a.ms - b.ms);
    let i0 = list.findIndex((t) => t.name === '冬至');
    const blocks = [];
    let F = null;
    for (let i = i0; i < list.length; i++) {
      const t = list[i];
      const td = absDayOf(t.ms, null);
      if (F === null) {                       // 起点：取使超神天数落在 [chaoLimit−14, chaoLimit] 的上元符头
        F = td - chaoLimit;
        while (!isShangYuanFutou(F)) F++;
        while (td - F > chaoLimit) F += 15;
        while (td - F < chaoLimit - 14) F -= 15;
      }
      const chao = td - F;
      for (let rep = 0; ; rep++) {
        for (let k = 0; k < 3; k++) blocks.push({ start: F + 5 * k, term: t.name, termMs: t.ms, yuan: k, run: rep > 0, chao, F0: F });
        F += 15;
        // 只有芒种、大雪之后才能置闰：若下一节气的超神天数仍超过上限，就把本节气三元重复一遍
        const nxt = list[i + 1];
        if ((t.name === '芒种' || t.name === '大雪') && nxt && absDayOf(nxt.ms, null) - F > chaoLimit) continue;
        break;
      }
    }
    zhirunCache.set(key, blocks);
    return blocks;
  }
  function findBlock(blocks, abs) {
    let lo = 0, hi = blocks.length - 1;
    if (!blocks.length || abs < blocks[0].start || abs >= blocks[hi].start + 5) return null;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (blocks[mid].start <= abs) lo = mid; else hi = mid - 1; }
    return blocks[lo];
  }

  function computeJu(utMs, dayIdx, opts) {
    opts = opts || {};
    const method = opts.method || DEFAULT_METHOD;
    const params = Object.assign({}, METHOD_PARAMS.zhirun, METHOD_PARAMS.maoshan, DEFAULT_PARAMS, opts.params || {});
    const ta = termAt(utMs);
    const futouIdx = (((dayIdx - ((dayIdx % 10) % 5)) % 60) + 60) % 60; // 最近的甲/己日
    const fb = futouIdx % 12;
    const yuanByFutou = [0, 6, 3, 9].includes(fb) ? 0 : [2, 8, 5, 11].includes(fb) ? 1 : 2;
    const base = {
      term: ta.cur, nextTerm: ta.next, prevTerm: ta.prev, actualTerm: ta.cur.name,
      futou: gzOf(futouIdx), daysSinceFutou: (dayIdx % 10) % 5, ta,
      method, methodName: METHODS[method], params, run: false
    };
    const done = (termName, yuan, extra) => Object.assign(base, {
      termName, yang: YANG_TERMS.has(termName), ju: JU_TABLE[termName][yuan], yuan, yuanName: YUAN_NAME[yuan]
    }, extra);

    if (method === 'zhirun') {
      const abs = absDayOf(utMs, opts.lon === undefined ? null : opts.lon);
      const blk = findBlock(zhirunBlocks(params.chaoLimit, params.epochYear), abs);
      if (blk) {
        return done(blk.term, blk.yuan, {
          run: blk.run, chao: { kind: chaoKind(blk.chao), days: Math.abs(blk.chao), signed: blk.chao },
          futouTerm: blk.term
        });
      }
      // 超出块表范围（1880 年前或 2102 年后）退回拆补法，并在结果里注明
      base.fallback = true;
    }
    if (method === 'maoshan') {
      const hours = (utMs - ta.cur.ms) / 3600000;
      const yuan = Math.min(2, Math.floor(hours / (params.yuanShichen * 2)));
      return done(ta.cur.name, yuan, { chao: { kind: '不适用', days: 0, signed: 0 }, elapsedHours: hours, usedShichen: Math.floor(hours / 2) });
    }
    // 拆补法（也是退回时的做法）。超神/接气：本节气交节日与最近上元符头相差的天数，仅供对照，不影响定局
    const td = absDayOf(ta.cur.ms, null);
    let d = ((((td - 2451545 + 54) % 15) + 15) % 15);  // 交节日距上一个上元符头的天数 0..14
    if (d > 7) d -= 15;                                // 取最近：-7..7
    return done(ta.cur.name, yuanByFutou, { chao: { kind: chaoKind(d), days: Math.abs(d), signed: d } });
  }

  /* ───────────── 起盘（时家转盘） ───────────── */
  const RING = [1, 8, 3, 4, 9, 2, 7, 6]; // 外圈八宫，顺时针（坎→艮→震→巽→离→坤→兑→乾）
  const PALACE_NAME = { 1: '坎一宫', 2: '坤二宫', 3: '震三宫', 4: '巽四宫', 5: '中五宫', 6: '乾六宫', 7: '兑七宫', 8: '艮八宫', 9: '离九宫' };
  const PALACE_SHORT = { 1: '坎', 2: '坤', 3: '震', 4: '巽', 5: '中', 6: '乾', 7: '兑', 8: '艮', 9: '离' };
  const PALACE_DIR = { 1: '北', 2: '西南', 3: '东', 4: '东南', 5: '中', 6: '西北', 7: '西', 8: '东北', 9: '南' };
  const PALACE_EL = { 1: '水', 2: '土', 3: '木', 4: '木', 5: '土', 6: '金', 7: '金', 8: '土', 9: '火' };
  const STAR_HOME = { 1: '天蓬', 2: '天芮', 3: '天冲', 4: '天辅', 5: '天禽', 6: '天心', 7: '天柱', 8: '天任', 9: '天英' };
  const DOOR_HOME = { 1: '休', 2: '死', 3: '伤', 4: '杜', 6: '开', 7: '惊', 8: '生', 9: '景' };
  const EARTH_ORDER = ['戊', '己', '庚', '辛', '壬', '癸', '丁', '丙', '乙'];
  const LIUYI = ['戊', '己', '庚', '辛', '壬', '癸']; // 甲子戊、甲戌己、甲申庚、甲午辛、甲辰壬、甲寅癸
  const DEITIES = ['值符', '螣蛇', '太阴', '六合', '白虎', '玄武', '九地', '九天'];
  const BRANCH_PALACE = { 0: 1, 1: 8, 2: 8, 3: 3, 4: 4, 5: 4, 6: 9, 7: 2, 8: 2, 9: 7, 10: 6, 11: 6 };

  function buildPlate({ yang, ju, hourIdx }) {
    const hourStemI = hourIdx % 10;
    const xun = Math.floor(hourIdx / 10) * 10;
    const yi = LIUYI[xun / 10];
    // 地盘：戊落局数宫，阳遁顺（宫数递增）、阴遁逆
    const earth = {};
    for (let i = 0; i < 9; i++) {
      const p = yang ? ((ju - 1 + i) % 9) + 1 : ((((ju - 1 - i) % 9) + 9) % 9) + 1;
      earth[p] = EARTH_ORDER[i];
    }
    const palaceOfEarth = {};
    Object.keys(earth).forEach((p) => { palaceOfEarth[earth[p]] = +p; });
    const H = palaceOfEarth[yi];              // 旬首六仪所在地盘宫
    const Hring = H === 5 ? 2 : H;            // 中五寄坤二
    const hourStem = TG[hourStemI];
    const effStem = hourStem === '甲' ? yi : hourStem; // 甲遁于六仪
    const T0 = palaceOfEarth[effStem];
    const T = T0 === 5 ? 2 : T0;              // 值符星落宫（时干所在地盘宫）
    // 天盘：九星整体转动，使值符星到达 T；各星携带原宫地盘干
    const starShift = (RING.indexOf(T) - RING.indexOf(Hring) + 8) % 8;
    const heaven = {};
    RING.forEach((q, i) => {
      const dest = RING[(i + starShift) % 8];
      heaven[dest] = { star: STAR_HOME[q], stem: earth[q], from: q };
    });
    const qinDest = RING[(RING.indexOf(2) + starShift) % 8]; // 天禽寄坤二，随天芮
    heaven[qinDest].rider = '天禽';
    heaven[qinDest].stem2 = earth[5];
    // 人盘：值使门从旬首宫起，按时辰数阳顺阴逆走九宫定落点，其余七门依序随转
    const steps = hourIdx - xun;
    const Td0 = yang ? ((H - 1 + steps) % 9) + 1 : ((((H - 1 - steps) % 9) + 9) % 9) + 1;
    const Td = Td0 === 5 ? 2 : Td0;
    const doorShift = (RING.indexOf(Td) - RING.indexOf(Hring) + 8) % 8;
    const doors = {};
    RING.forEach((q, i) => { doors[RING[(i + doorShift) % 8]] = DOOR_HOME[q]; });
    // 神盘：值符神随值符星，阳遁顺布、阴遁逆布
    const deities = {};
    const ds = RING.indexOf(T);

    const kong = [...new Set(kongBranches.map((b) => BRANCH_PALACE[b]))];
    const hb = hourIdx % 12;
    const horseBranch = [8, 0, 4].includes(hb) ? 2 : [2, 6, 10].includes(hb) ? 8 : [5, 9, 1].includes(hb) ? 11 : 5;
    return {
      yang, ju, hourIdx, xunIdx: xun, xunName: gzOf(xun).gz, yi, effStem,
      earth, palaceOfEarth, heaven, doors, deities,
      zhifu: { star: H === 5 ? '天禽' : STAR_HOME[H], ringStar: STAR_HOME[Hring], home: H, land: T },
      zhishi: { door: H === 5 ? '死' : DOOR_HOME[H], home: H, land: Td, steps },
      starShift, doorShift,
      fuyin: T === Hring, fanyin: starShift === 4,
      kong, kongBranches: kongBranches.map((b) => DZ[b]), horse: BRANCH_PALACE[horseBranch], horseBranch: DZ[horseBranch]

  }

  // 校准常数：把各类分数在 2026 全年 4380 个时辰里的中位数对齐到 50（由 calibrate.js 生成）。

  function analyze(pl, P) {

        ? '<label class="mp">每元时辰数<input type="number" min="12" max="120" step="1" data-mparam="yuanShichen" value="' + S.yuanShichen + '"></label>' : '';

  // 当前盘的定局信息：方法、超神/接气、闰期
  function methodPills(J) {
    var t = '';
    if (J.method === 'chaibu') t = '参考：交节日' + (J.chao.kind === '正授' ? '与上元符头同日（正授）' : '距上元符头 ' + J.chao.days + ' 天（' + J.chao.kind + '）') + '，不影响定局';
    else if (J.method === 'zhirun') t = J.chao.kind === '正授' ? '正授（符头与节气同日）' : J.chao.kind + ' ' + J.chao.days + ' 天';
    else t = '交节后第 ' + (J.usedShichen + 1) + ' 时辰（每元 ' + J.params.yuanShichen + ' 个）';
    var out = '<span class="pill">' + J.methodName + '<b>' + esc(t) + '</b></span>';
    if (J.method === 'zhirun') out += '<span class="pill' + (J.run ? ' hot' : '') + '">闰期<b>' + (J.run ? '是，重复' + J.termName + '三元' : '否') + '</b></span>';
    if (J.actualTerm !== J.termName) out += '<span class="pill">实际节气<b>' + J.actualTerm + '</b><span>已用' + J.termName + '局</span></span>';
    if (J.fallback) out += '<span class="pill hot">超出置闰法表范围<b>已退回拆补法</b></span>';

  /* ───── 盘面 SVG ───── */
  function plateSVG(c) {
    var an = c.analysis, out = [];
    Object.keys(POS).forEach(function (k) {
      var p = +k, x = POS[p][0] * 104, y = POS[p][1] * 104, pa = an.palaces[p];
      var center = p === 5;
      var fill = center ? 'rgba(226,187,104,0.05)'
        : pa.pct >= 58 ? 'rgba(226,187,104,0.12)'
        : pa.pct <= 42 ? 'rgba(217,72,47,0.13)' : 'rgba(140,196,230,0.05)';
      var extra = pa.isZhifu ? ' style="stroke:var(--gold);stroke-width:2.6"'
        : pa.isZhishi ? ' style="stroke:var(--cinnabar);stroke-width:2.6;stroke-dasharray:5 3"' : '';
      out.push('<g class="cell' + (S.palace === p ? ' sel' : '') + '" data-p="' + p + '" tabindex="0" role="button" aria-label="' + esc(pa.name + (pa.star ? '，' + pa.star : '') + (pa.door ? '，' + pa.door + '门' : '')) + '">');
      out.push('<rect class="cellbg" x="' + x + '" y="' + y + '" width="100" height="100" rx="6" fill="' + fill + '"' + extra + '/>');
      out.push('<text class="t-dim" x="' + (x + 7) + '" y="' + (y + 15) + '" font-size="11">' + esc(pa.name) + '</text>');
      if (pa.isZhifu || pa.isZhishi) {
        var tags = '';
        if (pa.isZhifu) tags += '<tspan style="fill:var(--gold)">值符</tspan>';
        if (pa.isZhishi) tags += '<tspan style="fill:var(--cinnabar)"> 值使</tspan>';
        out.push('<text x="' + (x + 7) + '" y="' + (y + 28) + '" font-size="10">' + tags + '</text>');
      }
      if (!center) {
        out.push('<text class="l-deity c-m" x="' + (x + 93) + '" y="' + (y + 15) + '" text-anchor="end" font-size="11">' + esc(pa.deity) + '</text>');
        out.push('<text class="l-star kai ' + cls(pa.starLabel) + '" x="' + (x + 50) + '" y="' + (y + 50) + '" text-anchor="middle" font-size="16">' + esc(pa.star) + '</text>');
        if (pa.rider) out.push('<text class="t-dim" x="' + (x + 88) + '" y="' + (y + 50) + '" text-anchor="middle" font-size="10">+禽</text>');
        out.push('<text class="t-stem kai" x="' + (x + 22) + '" y="' + (y + 72) + '" text-anchor="middle" font-size="18">' + esc(pa.heavenStem) + '</text>');
        out.push('<text class="l-earth t-earth kai" x="' + (x + 78) + '" y="' + (y + 72) + '" text-anchor="middle" font-size="16">' + esc(pa.earthStem) + '</text>');
        out.push('<text class="l-door kai ' + cls(pa.doorLabel) + '" x="' + (x + 50) + '" y="' + (y + 93) + '" text-anchor="middle" font-size="15">' + esc(pa.door) + '门</text>');
      } else {
        out.push('<text class="l-earth t-earth kai" x="' + (x + 50) + '" y="' + (y + 58) + '" text-anchor="middle" font-size="18">' + esc(pa.earthStem) + '</text>');
        out.push('<text class="t-dim" x="' + (x + 50) + '" y="' + (y + 90) + '" text-anchor="middle" font-size="11">中宫 寄坤二</text>');
      }
      out.push('</g>');
    });
    return '<svg viewBox="-2 -2 312 312" data-layer="' + S.layer + '" role="group" aria-label="奇门盘">' + out.join('') + '</svg>';
  }

  /* ───── 读盘面板 ───── */
  function dirTag(an, p, good) {

        '<div class="row"><span class="k">神</span><b>' + pa.deity + '</b><span>' + pa.deityLabel + '</span><span class="d">' + Q.DEITY_INFO[pa.deity] + '</span></div>' +

    return '<aside class="reading v-' + v.cls + '" aria-label="读盘">' +
      '<div class="rd-top"><div class="big"><span class="vw">' + v.word + '</span><span class="vs">综合 ' + an.overall + ' 分</span></div>' +

      '<p class="advice">' + v.advice + '</p>' +
      '<p class="narrate">' + esc(Q.narrate(c)) + '</p>' +
      '<div class="facts"><span class="pill">' + J.termName + '<b>' + (J.yang ? '阳' : '阴') + '遁' + J.ju + '局</b></span>' +
      '<span class="pill">' + J.yuanName + '<b>符头 ' + J.futou.gz + '</b></span>' + methodPills(J) + '</div>' +
      edge + flags +
      '<div><h3>吉凶领域</h3><div>' + doms + '</div></div>' +
      '<div><h3>关键落位</h3>' + trio + '</div>' +
      '<div><h3>方位</h3>' + dirs + '</div>' +

      '</aside>';
  }

  /* ───── 今日 ───── */
  function viewToday() {
    var ms = S.ms, c = Q.chart(ms), an = c.analysis, b = bj(ms);

      '<p class="hint">十神以日干为准。纳音是六十甲子两两一组的五行意象，只作参考。</p>' +
      (dy ? '<h3>大运</h3><p class="muted">' + (dy.forward ? '顺排' : '逆排') + '，' + dy.years + ' 岁 ' + dy.months + ' 个月 ' + dy.days + ' 天起运（按传统口诀“三天折一年、一天折四个月”，从出生时刻到最近的节精确折算）。</p><div class="facts">' +
        dy.list.map(function (d) { return '<span class="pill">' + d.startAge + ' 岁<b>' + d.gz + '</b></span>'; }).join('') + '</div>'
        : '<p class="hint">选择男或女后，这里显示大运排列。</p>') + '</div>';
    var zwSec = (function () {
      var LN = window.QimenLunar, ZW = window.QimenZiwei, bp = bj(ms);
      var lu = LN.fromSolar(bp.y, bp.mo, bp.d);
      var zc = ZW.chart({ lunarYear: lu.year, month: lu.month, leap: lu.leap, day: lu.day, hourIdx: P.hour.branchI, male: S.bGender !== 'F' });
      var dayCN = lu.day <= 10 ? '初' + '一二三四五六七八九十'.charAt(lu.day - 1) : lu.day < 20 ? '十' + '一二三四五六七八九'.charAt(lu.day - 11) : lu.day === 20 ? '二十' : lu.day < 30 ? '廿' + '一二三四五六七八九'.charAt(lu.day - 21) : '三十';
      var posMap = { 5: [1, 1], 6: [1, 2], 7: [1, 3], 8: [1, 4], 4: [2, 1], 9: [2, 4], 3: [3, 1], 10: [3, 4], 2: [4, 1], 1: [4, 2], 0: [4, 3], 11: [4, 4] };
      var cells = zc.palaces.map(function (p) {
        var rc = posMap[p.branchI];
        var stars = p.stars.map(function (s) { return '<div class="st' + (s.name.length === 2 && /^(左辅|右弼|文昌|文曲)$/.test(s.name) ? ' mi' : '') + '">' + s.name + (s.hua ? '<i>化' + s.hua + '</i>' : '') + '</div>'; }).join('');
        return '<div class="zwc' + (p.role === '命宫' ? ' ming' : '') + '" style="grid-row:' + rc[0] + ';grid-column:' + rc[1] + '">' +
          '<div class="hd"><b>' + p.role + (p.isShen ? '·身' : '') + '</b><span>' + p.stem + p.branch + '</span></div>' + stars +
          '<div class="ft"><span>' + p.daxian[0] + '–' + p.daxian[1] + '岁</span></div></div>';
      }).join('');
      var mid = '<div class="zwmid"><div>农历 <b>' + lu.year + ' 年' + (lu.leap ? '闰' : '') + lu.month + ' 月' + dayCN + '</b>（' + zc.yearGZ + '年）</div>' +
        '<div>命宫 <b>' + zc.ming + '</b> · 身宫 <b>' + zc.shen + '</b> · <b>' + zc.juName + '</b></div>' +
        '<div>紫微在 <b>' + zc.ziwei + '</b> · 大限' + (S.bGender ? (zc.forward ? '顺行' : '逆行') : '按男命顺逆') + '</div>' +
        '<div>' + zc.sihua.join('　') + '</div></div>';
      return '<div class="sec"><h2>紫微斗数</h2><p class="hint">农历由天文方法算出（已对照 1976–2030 年春节与多个闰月）。排盘用三合派常见规则：十四主星加左辅右弼、文昌文曲、四化与大限。未排星曜亮度和杂曜；庚干四化各派说法不同，这里取“太阳禄、武曲权、太阴科、天同忌”。时辰取上面八字的时柱，农历日期取当天日期，晚子时不另行处理。</p>' +
        '<div class="zwgrid">' + cells + mid + '</div></div>';
    })();
    return '<div class="bgrid">' + form + '<div class="bout">' + info + bazi + zwSec + chartSec + personal + '</div></div>';
  }

  /* ───── 月历 ───── */
  function viewCal() {
    if (!S.calY) { var b0 = bj(S.ms); S.calY = b0.y; S.calM = b0.mo; }
    var y = S.calY, m = S.calM;
    var first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    var days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var todayKey = dayOf(nowMin()), selKey = dayOf(S.ms);
    var cells = WD.map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    for (var i = 0; i < first; i++) cells += '<div class="pad"></div>';
    for (var d = 1; d <= days; d++) {
      var key = y + '-' + pad(m) + '-' + pad(d);
      var avg = dayAvg(y, m, d), vv = vOf(avg);
      var bg = vv.cls === 'good' ? 'rgba(226,187,104,0.16)' : vv.cls === 'bad' ? 'rgba(217,72,47,0.16)' : 'rgba(140,196,230,0.06)';
      cells += '<button type="button" data-day="' + key + '" class="' + (key === selKey ? 'on' : '') + (key === todayKey ? ' today' : '') +
        '" style="background:' + bg + '" aria-label="' + key + ' ' + vv.word + '，均分 ' + avg + '"><b>' + d + '</b><small style="color:' + vColor(vv.cls) + '">' + vv.word + '</small></button>';
    }
    return '<div class="sec"><div class="datenav"><button type="button" class="btn sq" data-cal="-1" aria-label="上个月">‹</button>' +
      '<span class="pill"><b>' + y + ' 年 ' + m + ' 月</b></span><button type="button" class="btn sq" data-cal="1" aria-label="下个月">›</button></div>' +
      '<div class="cal">' + cells + '</div>' +
      '<p class="hint">每格是当天十二时辰的平均分。点任一天，跳到当天的盘。今日加粗标记。</p></div>';
  }

  /* ───── 梅花易数与易经 ───── */
  function viewMei() {
    var M = window.QimenMei;
    var mode = S.meiMode === 'time' ? 'time' : 'num';
    var up = Math.max(0, Math.floor(+S.meiUp) || 0), low = Math.max(0, Math.floor(+S.meiLow) || 0);
    var r;
    if (mode === 'time') {
      var b = bj(S.ms);
      r = M.fromTime(b.y, b.mo, b.d, Q.shichenIndexOf(S.ms));
    } else {
      r = M.fromNumbers(up, low);
    }
    var hexCard = function (title, h, movePos) {
      var out = '';
      for (var i = 5; i >= 0; i--) {
        out += '<div class="hx-line' + (movePos === i + 1 ? ' mov' : '') + '"><i class="' + (h.lines[i] ? 'yang' : 'yin') + '"></i></div>';
      }
      return '<div class="hxcard"><h3>' + title + '</h3><div class="hx">' + out + '</div>' +
        '<div class="hxname">' + h.name + ' <span class="muted">（' + h.upper.name + '上' + h.lower.name + '下）</span></div>' +
        '<p class="hint">' + h.mean + '</p></div>';
    };
    var form = '<form class="formcard" onsubmit="return false">' +
      '<div class="field"><span class="lb">起卦方式</span><div class="row">' +
      '<label><input type="radio" name="mm" value="num" data-bind="meiMode"' + (mode === 'num' ? ' checked' : '') + '>数字起卦</label>' +
      '<label><input type="radio" name="mm" value="time" data-bind="meiMode"' + (mode === 'time' ? ' checked' : '') + '>用时间起卦</label></div></div>' +
      (mode === 'num'
        ? '<div class="field"><label for="mu">上数（决定上卦）</label><input id="mu" type="number" min="0" data-bind="meiUp" value="' + up + '"></div>' +
          '<div class="field"><label for="ml">下数（决定下卦；上下两数之和决定动爻）</label><input id="ml" type="number" min="0" data-bind="meiLow" value="' + low + '"></div>'
        : '<p class="hint">使用「今日吉凶」里选定的时刻：' + dayOf(S.ms) + ' ' + hmOf(S.ms) + '。时间起卦用公历年支和公历月日代替农历，结果与传统农历起卦可能不同。</p>') +
      '</form>';
    var cards = '<div class="hxrow">' + hexCard('本卦', r.ben, r.mv) + hexCard('变卦', r.bian, r.mv) + hexCard('互卦', r.hu, 0) + '</div>';
    var rel = r.rel;
    var tiyong = '<div class="trio">' +
      '<div class="row"><span class="k">动爻</span><b>' + r.yao + '</b><span>第 ' + r.mv + ' 爻（自下而上）</span></div>' +
      '<div class="row"><span class="k">用卦</span><b>' + r.yong.name + '</b><span>' + r.yong.el + '行</span><span class="d">动爻在' + (r.mv <= 3 ? '下' : '上') + '卦，所以' + r.yong.name + '为用。</span></div>' +
      '<div class="row"><span class="k">体卦</span><b>' + r.ti.name + '</b><span>' + r.ti.el + '行</span><span class="d">另一卦为体，代表问事的人自己。</span></div>' +
      '</div>';
    var verdict = '<div class="sec v-' + (rel.level === 'good' ? 'good' : 'bad') + '"><span class="vw">' + rel.kind + '</span><p class="advice">' + rel.text + '</p></div>';
    var note = '<p class="hint">梅花易数是北宋邵雍传下的起卦法。卦象和体用关系按古法算出；体用生克的判语是常见说法，不构成预测。卦义是本页的简述，不是卦辞原文。</p>';
    return '<div class="bgrid">' + form + '<div class="bout">' + cards + tiyong + verdict + note + '</div></div>';
  }

  /* ───── 说明 ───── */
  function viewRules() {
    return '<div class="rules">' +
      '<section><h2>排盘方法</h2><div class="twocol">' +
      '<div><h3>时间与换日</h3><ul><li>按北京时间起盘，可选填出生地经度换算真太阳时。</li><li>23:00 换日，晚子时计入次日。</li><li>立春交节换年，节（不含气）交节换月。</li></ul></div>' +
      '<div><h3>定局（三选一，默认拆补法）</h3><ul><li>符头：甲子、己卯、甲午、己酉日为上元符头，每隔 5 天一个符头；符头地支子午卯酉为上元，寅申巳亥为中元，辰戌丑未为下元。</li><li><b>拆补法</b>：节气取精确交节时刻，元由当天所属符头定。</li><li><b>置闰法</b>：局按符头成块，每 5 天一块，三块为一个节气。符头早于节气叫超神，晚于叫接气。超神超过上限（默认 9 天）后，在芒种（阳遁）或大雪（阴遁）之后重复使用该节气三元（闰期，15 天），芒种用 6/3/9，大雪用 4/7/1。</li><li><b>茅山法</b>：不置闰不拆补，也不看符头。从交节时刻起用该节气上元，每 60 个时辰（5 天）转一元；下元用满而下一节气未到，继续用下元，下元未用满而新节气已到，则舍弃剩余部分。</li><li>三种方法共用同一张节气局数表，只是“哪一刻用哪个节气的哪一元”不同。2000–2030 年三者不全相同的日子约占七成，见仓库里的对比表。</li></ul></div>' +
      '<div><h3>布盘</h3><ul><li>地盘：戊起局数宫，阳遁顺布、阴遁逆布。</li><li>天盘：九星随值符星整体转动，每宫带地盘干。</li><li>值使门：从旬首宫起，按时辰数走九宫。其余七门随之转动。</li><li>八神：值符神随值符星，阳遁顺、阴遁逆。</li></ul></div>' +
      '</div></section>' +
      '<section><h2>三种定局方法待确认的细节</h2><ul>' +
      '<li class="warn">茅山法：我查到的两份公开资料都说它“不置闰、不拆补、从交节起用上元”，并没有“以接气为主”这一说法，所以按资料实现。若你指的是另一种“以接气为主”的茅山法，请告诉我规则。</li>' +
      '<li class="warn">茅山法：“60 个时辰”按交节时刻起算的 120 小时，不按整时辰对齐；交节落在时辰中间如何计，资料没有说明。</li>' +
      '<li class="warn">置闰法：超神上限默认 9 天，超过才置闰（即超神最多 9 天、接气最多 5 天）；资料没有给出天数门槛，这个数是按你的说明设的，可以在页面里改。真实节气间隔不均匀，所以实际超神、接气天数会略超出这个理想范围。</li>' +
      '<li class="warn">置闰法：闰期长度取 15 天（重复整个三元）；闰期只能出现在芒种或大雪之后；起点用 1880 年冬至往后推，之后的置闰位置由规则本身决定。置闰法没有统一的历史起点，不同软件可能差一轮。</li></ul></section>' +
      '<section><h2>吉凶怎么算</h2><ul>' +
      '<li>每宫：门、星、神各有基础分，再加上天遁、地遁、人遁等格局，以及门迫、击刑、空亡的扣分。</li>' +
      '<li>整盘：值符宫 35%、值使宫 25%、时干宫 20%、日干宫 20%，伏吟、反吟、五不遇时另作扣分。</li>' +
      '<li>领域：财运看生门，事业看开门与值符，人缘看六合与太阴，学业看景门与天辅，健康看天心与休门，出行看开门与驿马。</li>' +
      '<li>分数以当日同类时辰的中位数为 50 分校准，所以颜色表示相对平常的好坏。</li></ul></section>' +
      '<section><h2>其他理论</h2><ul>' +
      '<li>梅花易数：数字起卦用上下两数分别除以八取余，定上卦和下卦；两数之和除以六取余，定动爻。时间起卦用公历年支、月、日代替农历，因此与传统农历起卦可能不同。</li>' +
      '<li>易经六十四卦：按文王卦序排列，卦名与上下卦的对应已逐一核对；卦义是本页简述，不是卦辞原文。</li>' +
      '<li>四柱八字：十神以日干为准；纳音按六十甲子两两一组；大运的起运年龄按“三天折一年、一天折四个月”从出生时刻到最近的节精确折算；这是传统折算口诀，不是天文事实。</li>' +
      '<li class="warn">紫微斗数：已实现命宫、身宫、五行局、十四主星、左辅右弼、文昌文曲、四化和大限；未实现星曜亮度、杂曜、流年。农历用天文方法算出，不是查表，已对照春节与闰月核对；排法按三合派常见规则，不同流派（如庚干四化、闰月、晚子时）有差异，还没有用真实命盘逐项核对。</li></ul></section>' +
      '<section><h2>验证与局限</h2><ul>' +
      '<li class="ok">节气时刻：与香港天文台 2026 年 12 个中气逐一比对，偏差不超过 0.6 分钟，超过官方一分钟精度的部分只有 0.58 分。</li>' +
      '<li class="ok">盘面结构：全年 4380 个时辰，检查九星、八门、八神各 8 个互异，值符神落在值符星所在宫等不变量，全部通过。</li>' +
      '<li class="warn">版本差异：拆补法在不同门派中细节不完全一致，本页采用一种读法。2026-09-11 08:00 这一例，日柱戊子，符头甲申（申属中元），按白露“九、三、六”的三元表，应为阴三局中元，本页即此结果；另一个公开排盘页面给出阴九局（相当于上元），原因未能查明，可能用了超神接气或置闰一类的不同定局法，本页未实现这些方法。</li>' +
      '<li class="warn">阴遁八神的排列，公开资料只确认了阳顺阴逆的方向，我试着查过两处公开页面，都没有给出完整的阴遁排法，所以这部分仍未核对，欢迎有古籍或实盘的人帮忙核对。</li>' +
      '<li>奇门遁甲没有经过科学验证。页面展示的吉凶是按上述规则算出的结果，仅供文化研究参考，不要用于重大决策。</li></ul></section>' +
      '</div>';
  }

  /* ───── 渲染与交互 ───── */
  function render() {
    document.querySelectorAll('[data-tab]').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === S.tab));
    });
    var sm = document.getElementById('subm'); if (sm) sm.textContent = Q.METHODS[S.method];
    var html;
    try {
      html = S.tab === 'today' ? viewToday() : S.tab === 'birth' ? viewBirth() : S.tab === 'calendar' ? viewCal() : S.tab === 'mei' ? viewMei() : viewRules();
    } catch (err) {
      console.error(err);
      html = '<p class="flag">排盘出错：' + esc(err.message) + '</p>';
    }
    app.innerHTML = (S.tab === 'today' || S.tab === 'birth' || S.tab === 'calendar' ? methodBar() : '') + html;
  }
  function go(tab) { S.tab = tab; if (tab !== 'today') S.palace = null; render(); }

  document.addEventListener('click', function (e) {
    var el;
    if ((el = e.target.closest('[data-tab]'))) { go(el.getAttribute('data-tab')); return; }
    if ((el = e.target.closest('[data-ms]'))) { S.ms = +el.getAttribute('data-ms'); render(); return; }
    if ((el = e.target.closest('[data-method]'))) { S.method = el.getAttribute('data-method'); applyMethod(); render(); return; }
    if ((el = e.target.closest('[data-layer]'))) { S.layer = el.getAttribute('data-layer'); render(); return; }
    if ((el = e.target.closest('[data-p]'))) { var p = +el.getAttribute('data-p'); S.palace = S.palace === p ? null : p; render(); return; }
    if ((el = e.target.closest('[data-nav]'))) {
      var n = el.getAttribute('data-nav');
      S.ms = n === 'now' ? nowMin() : S.ms + (+n) * DAY;
      render(); return;
    }
    if ((el = e.target.closest('[data-cal]'))) {
      S.calM += +el.getAttribute('data-cal');
      if (S.calM < 1) { S.calM = 12; S.calY--; }
      if (S.calM > 12) { S.calM = 1; S.calY++; }
      render(); return;
    }
    if ((el = e.target.closest('[data-day]'))) {
      S.ms = toMs(el.getAttribute('data-day'), '12:00');
      S.palace = null; S.tab = 'today'; render();
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'dIn' || t.id === 'tIn') {
      var d = document.getElementById('dIn').value, tt = document.getElementById('tIn').value;
      if (okDate(d) && okTime(tt)) { S.ms = toMs(d, tt); render(); }
      return;
    }
    if (t.hasAttribute('data-mparam')) { S[t.getAttribute('data-mparam')] = t.value; applyMethod(); render(); return; }
    if (t.hasAttribute('data-bind')) {
      S[t.getAttribute('data-bind')] = t.value;
      render();
    }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.hasAttribute && e.target.hasAttribute('data-p')) {
      e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }
  });

  /* 背景星空：静态绘制，不做动画 */
  function drawSky() {
    var cv = document.getElementById('sky');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var g = ctx.createRadialGradient(W * 0.5, H * 0.22, 0, W * 0.5, H * 0.22, Math.max(W, H) * 0.7);
    g.addColorStop(0, '#16243f'); g.addColorStop(0.5, '#0b1326'); g.addColorStop(1, '#070b17');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < 260; i++) {
      var x = rnd() * W, y = rnd() * H, r = rnd() * 1.1 + 0.2, a = rnd() * 0.6 + 0.2;
      ctx.fillStyle = 'rgba(241,231,208,' + a.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  window.addEventListener('resize', drawSky);
  drawSky();
  applyMethod();
  render();
})();

</script>
